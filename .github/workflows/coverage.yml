name: Coverage repro

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  RUSTFLAGS: -C target-feature=+crt-static

jobs:
  coverage:
    name: Coverage (${{ matrix.project }}, ${{ matrix.rust }}, ${{ matrix.mode }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        project: [minimal, starship]
        rust: [stable, nightly]
        mode: [baseline]
        include:
          - project: minimal
            rust: nightly
            mode: argfile
          - project: minimal
            rust: nightly
            mode: argfile-no-wrapper
          - project: starship
            rust: nightly
            mode: no-wrapper
    env:
      CARGO_BUILD_WARNINGS: ${{ matrix.rust == 'stable' && 'deny' || 'allow' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ matrix.project == 'starship' && 'starship/starship' || github.repository }}
          # Pin the Starship revision reproduced locally; use this repo for reduction.
          ref: ${{ matrix.project == 'starship' && 'e4fe0f28f095ade7f832934d1dcb7de0ec6d6c13' || github.sha }}
          persist-credentials: false

      - name: Setup Rust
        run: |
          rustup toolchain install ${{ matrix.rust }} --profile minimal --component llvm-tools-preview --no-self-update
          rustup default ${{ matrix.rust }}

      - name: Cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install cargo-llvm-cov
        # Fork that expands Cargo's @argfile rustc invocation.
        # https://github.com/davidkna/cargo-llvm-cov/tree/fix-argfile
        run: >-
          cargo install --git https://github.com/davidkna/cargo-llvm-cov --force
          --rev 20b4ed88752fda8416fee9485dce907c645f4412 --locked cargo-llvm-cov

      - name: Force Cargo response files
        if: startsWith(matrix.mode, 'argfile')
        # Cargo's own test switch reproduces the long-command fallback without dependencies.
        run: '"__CARGO_TEST_FORCE_ARGFILE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append'

      - name: Show versions
        run: |
          New-Item -ItemType Directory -Force target/coverage-debug | Out-Null
          rustc -Vv 2>&1 | Tee-Object -FilePath target/coverage-debug/versions.txt
          cargo -V 2>&1 | Tee-Object -FilePath target/coverage-debug/versions.txt -Append
          cargo llvm-cov --version 2>&1 | Tee-Object -FilePath target/coverage-debug/versions.txt -Append
          # Record the git source and revision so artifacts prove the fork was used.
          cargo install --list 2>&1 | Select-String -Pattern 'cargo-llvm-cov' -Context 0,1 |
            Out-String -Width 400 | Tee-Object -FilePath target/coverage-debug/versions.txt -Append

      - name: Generate coverage
        id: coverage
        # Avoid unrelated Mercurial setup while retaining the failing report path.
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          cargo llvm-cov ${{ contains(matrix.mode, 'no-wrapper') && '--no-rustc-wrapper' || '' }} -vv --color never --all-features --locked --workspace --lcov --output-path lcov.info -- --include-ignored --skip hg 2>&1 |
            Tee-Object -FilePath target/coverage-debug/coverage.log
          exit $LASTEXITCODE

      - name: Inspect coverage binaries
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        run: |
          $sysroot = rustc --print sysroot
          $hostTriple = ((rustc -Vv | Select-String '^host: ') -replace '^host: ', '').Trim()
          $llvmBin = Join-Path $sysroot "lib/rustlib/$hostTriple/bin"
          & "$llvmBin/llvm-cov.exe" --version 2>&1 |
            Tee-Object -FilePath target/coverage-debug/versions.txt -Append

          $objects = Get-ChildItem target/llvm-cov-target/debug -Recurse -Filter *.exe |
            Where-Object { $_.Name -match '^(starship(?:_poc_cov)?|poc_cov_bin)-[0-9a-f]+\.exe$' }
          $objects | Select-Object FullName, Length | Format-Table -AutoSize |
            Out-String -Width 400 | Tee-Object -FilePath target/coverage-debug/objects.txt
          foreach ($object in $objects) {
            & "$llvmBin/llvm-readobj.exe" --file-headers --sections $object.FullName 2>&1 |
              Tee-Object -FilePath "target/coverage-debug/$($object.Name).sections.txt"
            if ($LASTEXITCODE -ne 0) { throw "llvm-readobj failed for $($object.FullName)" }
          }
          Get-ChildItem target/llvm-cov-target -Filter *.profdata | ForEach-Object {
            & "$llvmBin/llvm-profdata.exe" show $_.FullName 2>&1 |
              Tee-Object -FilePath "target/coverage-debug/$($_.Name).summary.txt"
            if ($LASTEXITCODE -ne 0) { throw "llvm-profdata failed for $($_.FullName)" }
          }

      - name: Upload coverage diagnostics
        if: ${{ !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ matrix.project }}-${{ matrix.rust }}-${{ matrix.mode }}
          retention-days: 7
          compression-level: 1
          include-hidden-files: true
          path: |
            target/coverage-debug/
            lcov.info
            target/llvm-cov-target/*.profdata
            target/llvm-cov-target/*.profraw
            target/llvm-cov-target/debug/deps/starship*.exe
            target/llvm-cov-target/debug/deps/poc_cov_bin-*.exe
            target/llvm-cov-target/debug/build/starship*/**/out/starship*.exe
            target/llvm-cov-target/debug/build/starship*/**/out/poc_cov_bin-*.exe
            target/llvm-cov-target/debug/build/starship*/**/fingerprint/*.json
            target/llvm-cov-target/debug/.fingerprint/starship*/*.json
            target/llvm-cov-target/debug/build/starship*/**/run/stdout
            target/llvm-cov-target/debug/build/starship*/output
            target/llvm-cov-target/debug/build/starship*/**/out/*.rc
            target/llvm-cov-target/debug/build/starship*/**/out/*.res
